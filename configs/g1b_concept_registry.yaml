version: 1
frozen_on: 2026-09-17
status: seed_sampling_frame
description: >-
  Pre-registered 40-concept G1B acquisition frame. Entries are candidates and
  controls, not observed trend outcomes. Every transfer label remains unassigned
  until timestamped U.S. and China evidence passes the source-readiness gate.

design:
  required_markets: [US, CN]
  target_concept_count: 40
  category_quotas:
    collectibles_hobbies: 5
    personal_tech: 5
    fashion_accessories: 5
    beauty_tools: 5
    home_decor_organization: 5
    kitchen_drinkware: 5
    fitness_outdoor: 5
    pet_lifestyle: 5
  sampling_role_quotas:
    emerging_candidate: 8
    mature_anchor: 8
    stable_control: 8
    ambiguity_probe: 8
    seasonal_control: 8
  acquisition_targets:
    visual_assets_per_concept_market: 5
    query_anchors_per_concept_market: 2
    timestamp_sources_per_concept_market: 2
    history_weeks: 104
    prospective_snapshot_weeks: 12
    wave_count: 4
    concepts_per_wave: 10

research_seeds:
  internal_vocabulary_review:
    source_type: internal_protocol
    url: https://github.com/alex-jb/bridgetrend-vision
    use: Bilingual query and product-boundary design; not popularity evidence.
  user_observed_baidu_2026_09_17:
    source_type: user_observation
    url: https://index.baidu.com/
    use: Candidate discovery only; screenshots are not machine-readable labels.
  pinterest_predicts_2026:
    source_type: platform_forecast
    url: https://business.pinterest.com/en-gb/pinterest-predicts/
    use: Style and seasonality candidate discovery; not China-market evidence.
  tiktok_next_2026:
    source_type: platform_forecast
    url: https://newsroom.tiktok.com/
    use: Social-commerce candidate discovery; not a product-level outcome label.
  visual_benchmark_design:
    source_type: benchmark_protocol
    url: https://github.com/alex-jb/bridgetrend-vision/blob/codex/opencv-agentic-vision/docs/annotation_protocol.md
    use: Adds stable controls and hard visual boundaries to prevent a positive-only benchmark.

