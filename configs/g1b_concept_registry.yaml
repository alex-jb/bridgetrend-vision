    taxonomy_category: collectible_figure
    sampling_role: mature_anchor
    wave: 1
    label_status: unverified
    transfer_label: unassigned
    market_queries:
      US:
        include: [blind box collectible, blind box figure, designer toy blind box]
        exclude: [subscription box, cardboard gift box]
      CN:
        include: [盲盒手办, 潮玩盲盒, 盲盒公仔]
        exclude: [订阅盒, 礼品包装盒]
