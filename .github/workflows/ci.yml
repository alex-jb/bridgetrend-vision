name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: pip install "opencv-python-headless>=5,<6" numpy pandas PyYAML pytest
      - name: Run unit tests
        run: pytest
      - name: Smoke test evidence-agent CLI
        env:
          PYTHONPATH: src
        run: >-
          python scripts/run_evidence_agent.py
          --top-similarity 0.91
          --runner-up-similarity 0.76
          --quality-score 0.82
          --evidence-count 3
          --source-diversity 2
