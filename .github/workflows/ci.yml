name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas pytest
      - name: Run unit tests
        run: pytest
