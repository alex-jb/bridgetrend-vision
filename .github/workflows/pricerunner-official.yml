name: PriceRunner official source one-shot

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  evaluate:
    if: >-
      github.event.label.name == 'run-pricerunner-official' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require owner comment anchoring exact reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_SHA"
          test -z "$(git status --porcelain)"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" |
            jq -se --arg owner "$GITHUB_REPOSITORY_OWNER" --arg sha "$FROZEN_SHA" \
              '[.[][] | select(.user.login == $owner and .body == ("BT-PRICERUNNER-FREEZE:" + $sha))] | length > 0' >/dev/null
          echo "Owner-anchored freeze commit verified: $FROZEN_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact benchmark dependencies
        run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3
      - name: Download reviewed UCI ZIP to runner temporary storage
        env:
          UCI_ARCHIVE_URL: https://archive.ics.uci.edu/static/public/837/product%2Bclassification%2Band%2Bclustering.zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pricerunner"
          curl --fail --show-error --silent --location --max-time 120 --retry 2 \
            --dump-header "$RUNNER_TEMP/pricerunner/download.log" \
            --output "$RUNNER_TEMP/pricerunner/source.zip" \
            --write-out '%{url_effective}\n%{http_code}\n' "$UCI_ARCHIVE_URL" \
            > "$RUNNER_TEMP/pricerunner/curl-result.txt"
          python - <<'PY'
          import os, shutil, zipfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "pricerunner"
          with zipfile.ZipFile(root / "source.zip") as archive:
              members = [name for name in archive.namelist() if not name.endswith("/")]
              if members != ["pricerunner_aggregate.csv"]:
                  raise SystemExit(f"Unexpected ZIP members: {members!r}")
              with archive.open(members[0]) as src, (root / members[0]).open("wb") as dst:
                  shutil.copyfileobj(src, dst)
          PY
          export RETRIEVED_AT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "RETRIEVED_AT_UTC=$RETRIEVED_AT_UTC" >> "$GITHUB_ENV"
          echo "SOURCE_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/pricerunner/source.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SOURCE_CSV_SHA256=$(sha256sum "$RUNNER_TEMP/pricerunner/pricerunner_aggregate.csv" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit

          folder = Path(os.environ["RUNNER_TEMP"]) / "pricerunner"
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          initial = os.environ["UCI_ARCHIVE_URL"]
          effective, status = (folder / "curl-result.txt").read_text().splitlines()[:2]
          headers = (folder / "download.log").read_text(errors="replace")
          statuses = re.findall(r"(?im)^HTTP/\S+\s+(\d{3})", headers)
          locations = re.findall(r"(?im)^location:\s*(\S+)", headers)
          current = initial
          redirect_hosts = []
          for location in locations:
              current = urljoin(current, location)
              redirect_hosts.append(urlsplit(current).hostname)
          parts = urlsplit(effective)
          final_url_without_query = urlunsplit((parts.scheme, parts.hostname or "", parts.path, "", ""))
          record = {
              "initial_url": initial,
              "final_url_without_query_or_fragment": final_url_without_query,
              "http_status_chain": statuses,
              "final_http_status": status,
              "redirect_hosts": redirect_hosts,
              "retrieved_at_utc_clock": os.environ["RETRIEVED_AT_UTC"],
              "zip_sha256": digest(folder / "source.zip"),
              "csv_sha256": digest(folder / "pricerunner_aggregate.csv"),
              "header_log_sha256": digest(folder / "download.log"),
          }
          if status != "200" or not statuses or statuses[-1] != "200":
              raise SystemExit("Unexpected UCI HTTP response; stop before scoring")
          content = json.dumps(record, sort_keys=True, indent=2) + "\n"
          (folder / "acquisition-record.json").write_text(content)
          print("Sanitized acquisition record: " + json.dumps(record, sort_keys=True))
          print("Acquisition record SHA256: " + digest(folder / "acquisition-record.json"))
          PY
      - name: Source receipt, title-only ranking, replayed label evaluation
        env:
          FROZEN_SHA: ${{ github.event.pull_request.head.sha }}
          UCI_ARCHIVE_URL: https://archive.ics.uci.edu/static/public/837/product%2Bclassification%2Band%2Bclustering.zip
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/pricerunner"
          python scripts/pricerunner_title_baseline.py receipt \
            --expected-freeze-sha "$FROZEN_SHA" --archive "$folder/source.zip" \
            --csv "$folder/pricerunner_aggregate.csv" --archive-origin "$UCI_ARCHIVE_URL" \
            --retrieval-log "$folder/acquisition-record.json" --retrieved-at-utc "$RETRIEVED_AT_UTC" \
            --receipt "$folder/receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "pricerunner"
          receipt = json.loads((folder / "receipt.json").read_text())
          print("Pre-label source receipt metadata: " + json.dumps(receipt, sort_keys=True))
          PY
          python scripts/pricerunner_title_baseline.py rank \
            --expected-freeze-sha "$FROZEN_SHA" --archive "$folder/source.zip" \
            --csv "$folder/pricerunner_aggregate.csv" --receipt "$folder/receipt.json" \
            --retrieval-log "$folder/acquisition-record.json" \
            --predictions "$folder/predictions.json"
          echo "Pre-label predictions SHA256: $(sha256sum "$folder/predictions.json" | cut -d' ' -f1)"
          python scripts/pricerunner_title_baseline.py evaluate \
            --expected-freeze-sha "$FROZEN_SHA" --archive "$folder/source.zip" \
            --csv "$folder/pricerunner_aggregate.csv" --receipt "$folder/receipt.json" \
            --retrieval-log "$folder/acquisition-record.json" \
            --predictions "$folder/predictions.json" --outcomes "$folder/outcomes.json" \
            --report "$folder/report.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"]) / "pricerunner"
          report = json.loads((folder / "report.json").read_text())
          for key in ("label_unit", "source_provenance_status", "source_receipt_sha256", "predictions_sha256", "outcomes_sha256", "outcome_counts", "denominators", "rates", "cluster_bootstrap_95_percentile_intervals", "category_diagnostics_post_hoc"):
              print(f"Aggregate {key}: {json.dumps(report[key], sort_keys=True)}")
          PY
          echo "Aggregate report SHA256: $(sha256sum "$folder/report.json" | cut -d' ' -f1)"
      - name: Preserve source metadata and aggregate report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricerunner-metadata-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pricerunner/acquisition-record.json
            ${{ runner.temp }}/pricerunner/receipt.json
            ${{ runner.temp }}/pricerunner/report.json
          if-no-files-found: warn
          retention-days: 90
