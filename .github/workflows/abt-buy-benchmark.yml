name: Abt-Buy official-source benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/abt-buy-benchmark.yml"
      - "src/bridgetrend_vision/abt_buy_benchmark.py"
      - "scripts/benchmark_abt_buy.py"
      - "tests/test_abt_buy_benchmark.py"
      - "docs/abt_buy_identity_baseline.md"

permissions:
  contents: read

jobs:
  official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download source archive into temporary runner storage
        run: |
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
            https://dbs.uni-leipzig.de/files/datasets/Abt-Buy.zip \
            --output "${RUNNER_TEMP}/Abt-Buy.zip"
      - name: Run full-gallery baseline
        env:
          SOURCE_ZIP: ${{ runner.temp }}/Abt-Buy.zip
        run: |
          PYTHONPATH=src python scripts/benchmark_abt_buy.py \
            --archive "$SOURCE_ZIP" \
            --archive-origin https://dbs.uni-leipzig.de/files/datasets/Abt-Buy.zip
