[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgetrend-vision"
version = "0.2.0"
description = "Cross-market product discovery using multimodal computer vision"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "torch>=2.2",
  "torchvision>=0.17",
  "open_clip_torch>=3,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
faiss = ["faiss-cpu>=1.8"]
opencv5 = ["opencv-python-headless>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
