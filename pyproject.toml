[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgetrend-vision"
version = "0.8.1"
description = "Cross-market product discovery using multimodal computer vision"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "torch>=2.2",
  "torchvision>=0.17",
  "open_clip_torch>=3,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.16,<0.17"]
faiss = ["faiss-cpu>=1.8"]
opencv5 = ["opencv-python-headless>=5,<6"]
competition = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bridgetrend_vision = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
